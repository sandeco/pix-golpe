<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DETECTOR DE GOLPE — Rust + Jev × Python + DeepSeek</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; background: #080b12; color: #f3f5fa; font-synthesis: none; }
    * { box-sizing: border-box; }

    ::-webkit-scrollbar-track { background: #080b12; }

    h1, h2, h3, p, dl, dd { margin: 0; }

    button:disabled, select:disabled { opacity: .45; cursor: default; }

    #viewport { width: 100%; }
    #frame { position: relative; width: 1920px; margin-inline: auto; }
    #stage { position: relative; width: 1920px; padding: 0 32px 24px; display: grid; gap: 18px; background: radial-gradient(ellipse at 12% 0, #ff2d9514, transparent 750px), radial-gradient(ellipse at 90% 0, #6985f61a, transparent 750px), #0b0f18; }
    .topbar { position: sticky; top: 0; z-index: 10; min-height: 92px; padding: 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 30px; background: #0b0f18f5; border-bottom: 1px solid #ffffff12; backdrop-filter: blur(12px); }
    h1 { font-size: 42px; font-weight: 900; letter-spacing: -1.8px; }
    .controls { display: flex; align-items: center; gap: 18px; }
    .connection { display: flex; align-items: center; gap: 9px; color: #a7b1c1; font-size: 15px; margin-right: 10px; }
    .connection::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #f3bb62; }
    .connection[data-state="connected"]::before { background: #59e0a4; box-shadow: 0 0 12px #59e0a433; }
    .mode-control { display: flex; align-items: center; gap: 12px; }
    .mode-control label { font-size: 17px; color: #a7b1c1; }
    select { background: #171e2b; color: #f3f5fa; border: 1px solid #354052; border-radius: 12px; padding: 15px 38px 15px 16px; font-size: 19px; }
    .start { min-width: 170px; height: 57px; padding: 0 28px; border: 0; border-radius: 12px; background: #eef4f8; color: #111923; font-size: 22px; font-weight: 750; }
    .start:hover:enabled { background: #fff; box-shadow: 0 0 24px #ffffff18; }
    .start[data-action="stop"] { background: #c72c42; color: #fff; }
    .start[data-action="stop"]:hover:enabled { background: #e1374f; }
    .report-button { height: 57px; padding: 0 20px; border: 1px solid #53627c; border-radius: 12px; background: #1b2536; color: #eef4f8; font-size: 19px; font-weight: 650; }
    .report-button:hover:enabled { background: #29374e; }
    .race { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .lane { --accent: #ff2d95; --accent-light: #ff8cc6; --accent-dark: #55223f; position: relative; min-width: 0; padding: 20px 24px; border: 1px solid #ff2d9540; border-top: 4px solid var(--accent); border-radius: 22px; background: linear-gradient(155deg, #ff2d950c, transparent 600px), #111722; display: grid; gap: 16px; }
    .lane.python { --accent: #6985f6; --accent-light: #a7b8ff; --accent-dark: #26355f; border-color: #6985f650; border-top-color: var(--accent); background: linear-gradient(155deg, #6985f612, transparent 600px), #111722; }
    .lane h2 { color: var(--accent); font-size: 29px; line-height: 34px; font-weight: 750; letter-spacing: -.8px; }
    .lane-top { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 20px; align-items: center; }
    .counter { display: grid; gap: 10px; }
    .count-line { display: flex; align-items: baseline; gap: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .processed { font-size: 100px; font-weight: 800; line-height: 1; letter-spacing: -5px; color: var(--accent); }
    .out-of { color: #a6b1c2; font-size: 34px; font-weight: 500; letter-spacing: -1px; }
    .counter-caption { min-height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .stopped { padding: 3px 9px; border: 1px solid var(--accent); border-radius: 7px; background: var(--accent-dark); color: var(--accent-light); font-size: 14px; font-weight: 700; }
    .counter-label { font-size: 13px; letter-spacing: 2px; font-weight: 650; color: #9da9ba; }
    .progress { height: 14px; border-radius: 9px; overflow: hidden; background: var(--accent-dark); }
    .progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width 140ms linear; }
    .speed { display: grid; gap: 6px; margin: 0; }
    .speed-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
    .speed-row dt { font-size: 13px; letter-spacing: 1px; font-weight: 650; color: #9da9ba; }
    .speed-row dd { margin: 0; font-size: 22px; font-weight: 750; color: var(--accent-light); white-space: nowrap; }
    .speed-row dd small { font-size: 13px; font-weight: 500; color: #a6b1c2; margin-left: 5px; }
    .current-message { min-width: 0; display: grid; grid-template-rows: 148px 42px; gap: 8px; }
    .bubble { min-width: 0; border: 1px solid #ffffff12; background: #1b2331; color: inherit; text-align: left; padding: 12px 16px; border-radius: 6px 16px 16px 16px; overflow: hidden; }
    .bubble:disabled { opacity: 1; }
    .bubble:enabled { border-color: var(--accent); }

    .bubble .sender { display: block; }
    .sender { font-size: 15px; font-weight: 650; color: #b8c4d5; line-height: 20px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sender::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 10px; border-radius: 50%; background: var(--accent); }
    .message-text { font-size: 24px; line-height: 1.3; font-weight: 450; overflow-wrap: anywhere; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .bubble[data-empty="true"] { display: flex; flex-direction: column; justify-content: center; }
    .bubble[data-empty="true"] .message-text { color: #8592a5; }
    .verdict { min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid #ffffff12; border-radius: 10px; background: #ffffff04; }
    .verdict-symbol { display: grid; place-items: center; width: 25px; height: 25px; flex: 0 0 25px; border: 2px solid currentColor; border-radius: 50%; font-size: 17px; font-weight: 800; }
    .verdict-word { font-size: 22px; font-weight: 850; letter-spacing: -.5px; white-space: nowrap; }
    .verdict-type { font-size: 15px; line-height: 1.15; font-weight: 600; margin-left: auto; text-align: right; max-width: 220px; }
    .verdict[data-verdict="waiting"] { color: #76859a; }
    .verdict[data-verdict="waiting"] .verdict-word { font-size: 19px; font-weight: 500; letter-spacing: 0; }
    .verdict[data-verdict="ok"] { color: #79efb5; border-color: #3c9a6a80; background: #143929; }
    .verdict[data-verdict="revisar"] { color: #ffda79; border-color: #b3964680; background: #3b311b; }
    .verdict[data-verdict="golpe"] { color: #fff; border-color: #ff6975; background: #d62d42; animation: pulse 720ms ease-in-out infinite; }
    .verdict[data-verdict="error"] { color: #d4dae4; border-color: #7b879b80; background: #303a49; }
    .alert-wash { position: absolute; z-index: 3; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; border: 5px solid #ff5266; background: #ff304a; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 5px #ff435426, 0 0 30px #ff435438; } }
    .lane[data-stopped="true"] .verdict { animation-play-state: paused; }
    .graph-panel { min-width: 0; border: 1px solid #ffffff16; border-radius: 16px; background: #0b1320; overflow: hidden; scroll-margin-top: 110px; }
    .graph-heading { padding: 14px 16px 8px; display: flex; justify-content: space-between; align-items: start; gap: 20px; }
    .graph-heading-left { min-width: 0; }
    .graph-heading h3 { font-size: 20px; line-height: 26px; font-weight: 650; }
    .graph-key { font-size: 14px; color: #a6b5cb; margin-top: 4px; overflow-wrap: anywhere; }
    .graph-facts { flex-shrink: 0; color: var(--accent-light); font-size: 17px; line-height: 26px; text-align: right; font-variant-numeric: tabular-nums; }
    .graph-processing { font-size: 15px; color: #93a6c2; }
    .graph-canvas-wrap { position: relative; height: 420px; }
    .graph-canvas { display: block; width: 100%; height: 420px; }
    .graph-empty { position: absolute; inset: 0; display: grid; place-items: center; padding: 25px; color: #9aabc4; font-size: 24px; text-align: center; pointer-events: none; }
    .graph-tip { position: absolute; z-index: 2; pointer-events: none; padding: 8px 12px; border: 1px solid #ffffff22; border-radius: 9px; background: #0b1320f2; color: #dbe5f3; font-size: 14px; line-height: 1.45; white-space: nowrap; transform: translate(-50%, calc(-100% - 14px)); }
    .graph-tip[data-below="true"] { transform: translate(-50%, 16px); }
    .graph-tip strong { display: block; font-size: 15px; }
    .graph-tip[data-role="golpista"] strong { color: #ff526b; }
    .graph-tip[data-role="laranja"] strong { color: #ffad61; }
    .graph-tip[data-role="saque"] strong { color: var(--accent-light); }
    .graph-tip[data-role="visitada"] strong { color: #9fbde3; }
    .scam-history { display: grid; gap: 12px; }
    .scam-history h3 { color: #cbd5e5; font-size: 23px; line-height: 30px; font-weight: 650; }
    .list-empty { padding: 19px 14px; color: #8290a4; font-size: 17px; }
    .scam-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    .scam-row { width: 100%; display: grid; gap: 10px; padding: 17px 19px; text-align: left; color: #e7ecf5; background: #182131; border: 1px solid #ffffff12; border-left: 4px solid transparent; border-radius: 12px; }
    .scam-row:hover { background: #ffffff0b; }
    .scam-row[data-selected="true"] { border-color: var(--accent); border-left-color: var(--accent); background: var(--accent-dark); }
    .scam-sender { color: var(--accent-light); font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
    .scam-preview { font-size: 23px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
    .scam-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .scam-badge { border-radius: 5px; padding: 4px 8px; background: #922839; color: #ffe0e5; font-size: 13px; font-weight: 800; }
    .scam-type { font-size: 17px; color: #ced8e9; }
    .scam-probability { font-size: 18px; color: var(--accent-light); font-weight: 700; font-variant-numeric: tabular-nums; }
    .accumulator { align-self: end; border-top: 1px solid #ffffff12; padding-top: 5px; color: var(--accent); font-size: 26px; line-height: 30px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .money { border-top: 1px solid #ffffff0d; padding: 8px 16px 12px; }
    .money-empty { padding: 8px; color: #a5b1c4; font-size: 17px; text-align: center; }
    .money-content { display: grid; grid-template-rows: 74px auto; gap: 4px; }
    .money-flow { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 68px minmax(0, 1.15fr) 68px minmax(0, 1fr); align-items: start; }
    .money-group { min-width: 0; text-align: center; }
    .money-group h3 { font-size: 12px; line-height: 14px; letter-spacing: 1.5px; font-weight: 750; color: #c2cad7; }
    .money-group:first-child h3 { color: #ff818c; }
    .money-group:nth-child(3) h3 { color: #ffb771; }
    .money-group:last-child h3 { color: var(--accent-light); }
    .origin { width: 24px; height: 24px; display: grid; place-items: center; margin: 4px auto 2px; border-radius: 50%; background: #fb5064; box-shadow: 0 0 0 4px #fb506415; color: #400e19; }
    .origin svg { width: 18px; height: 18px; }
    .pix-key { font-size: 12px; line-height: 1.15; color: #e4bac2; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .accounts-space { height: 60px; display: grid; place-items: center; }
    .orange-grid, .cash-grid { display: grid; justify-content: center; gap: 2px; }
    .orange-grid { grid-template-columns: repeat(var(--columns, 4), 12px); }
    .account { display: block; position: relative; width: 12px; height: 12px; border-radius: 50%; background: #ffad61; box-shadow: inset 0 0 0 1px #ffd2a1; }
    .cash-grid { grid-template-columns: repeat(var(--columns, 2), var(--size, 52px)); gap: 6px; }
    .cash { display: grid; place-items: center; width: var(--size, 24px); height: var(--size, 24px); border-radius: 50%; background: var(--accent); color: #fff; font-size: calc(var(--size, 24px) * .58); font-weight: 750; }
    .no-accounts { font-size: 30px; color: #718098; }
    .arrow { position: relative; height: 3px; margin: 36px 8px 0 2px; background: #58667d; }
    .arrow::after { content: ""; position: absolute; right: 0; top: -5px; width: 12px; height: 12px; border-top: 3px solid #77869c; border-right: 3px solid #77869c; transform: rotate(45deg); }
    .coin { position: absolute; top: -7px; left: 0; width: 17px; height: 17px; border-radius: 50%; color: #64421b; background: #ffde83; box-shadow: 0 0 14px #ffe09c80; opacity: 0; font-size: 12px; line-height: 17px; text-align: center; font-weight: 800; }
    .money-summary { align-self: start; font-size: 15px; line-height: 1.3; color: #bac6d7; text-align: center; text-wrap: pretty; }
    .footer { display: flex; justify-content: center; align-items: center; color: #78869b; font-size: 15px; white-space: nowrap; }
    .final { position: fixed; z-index: 20; inset: 104px max(24px, calc((100vw - 1800px) / 2)) 24px; padding: 30px 38px; overflow-y: auto; border: 1px solid #43506a; border-radius: 24px; background: #101622; box-shadow: 0 20px 100px #000a; display: grid; grid-template-rows: 42px minmax(min-content, 1fr) 60px; gap: 24px; }
    .final-context { align-self: center; font-size: 26px; color: #b7c4d7; text-align: center; }
    .final-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    .final-side { --accent: #ff2d95; min-width: 0; padding: 28px 38px; border: 1px solid #ff2d9540; border-top: 4px solid var(--accent); border-radius: 18px; background: linear-gradient(150deg, #ff2d9510, transparent); }
    .final-side.python { --accent: #6985f6; border-color: #6985f640; border-top-color: var(--accent); background: linear-gradient(150deg, #6985f610, transparent); }
    .final-side h3 { font-size: 34px; letter-spacing: -.7px; color: var(--accent); }
    .time-label { font-size: 20px; color: #a7b4c7; margin-top: 34px; }
    .final-time { font-size: clamp(56px, 7.5vw, 144px); line-height: 1.2; font-weight: 800; letter-spacing: -7px; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .final-time small { font-size: .43em; letter-spacing: -1px; font-weight: 500; }
    .final-time.compact { font-size: 108px; }
    .final-stats { margin-top: 27px; }
    .stat-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 16px 0; border-top: 1px solid #ffffff10; }
    .stat-row dt { color: #a7b4c7; font-size: 22px; }
    .stat-row dd { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .final-actions { justify-self: center; display: flex; gap: 16px; align-items: center; }
    .final-restart { min-width: 224px; height: 60px; margin-top: 0; }
    #final-close { height: 60px; padding-inline: 28px; font-size: 20px; }
    .accuracy-report { z-index: 30; grid-template-rows: auto minmax(min-content, 1fr) auto; }
    .report-heading { display: flex; align-items: start; justify-content: space-between; gap: 24px; }
    .report-heading h2 { font-size: 28px; line-height: 1.3; font-weight: 700; }
    .report-note { margin-top: 8px; color: #a7b4c7; font-size: 16px; line-height: 1.4; }
    .report-close { flex-shrink: 0; height: 44px; padding-inline: 18px; }
    .report-side { padding: 24px; }
    .report-side h3 { font-size: 30px; }
    .report-evaluated { margin-top: 6px; color: #a7b4c7; font-size: 18px; }
    .confusion { width: 100%; margin-top: 22px; border-collapse: separate; border-spacing: 6px; table-layout: fixed; }

    .confusion th:first-child { width: 24%; text-align: left; }
    .confusion td { height: 100px; border: 1px solid #ffffff12; border-radius: 10px; background: #1c2738; text-align: center; font-size: 50px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .confusion .matrix-hit { background: #143929; border-color: #3c9a6a; color: #79efb5; }
    .confusion .matrix-error { background: #4d202d; border-color: #c74b60; color: #ff97a7; }
    .report-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
    .report-metrics [data-metric="custo"] dd { font-size: 24px; padding-top: 12px; white-space: nowrap; }
    .report-cost { border-top: 1px solid #ffffff18; padding-top: 20px; color: #eef4f8; font-size: 23px; line-height: 1.45; }
    .report-cost strong { color: var(--accent); font-variant-numeric: tabular-nums; }
    .report-metrics dt { color: #b7c4d7; font-size: 19px; }
    .report-metrics dd { margin-top: 4px; color: var(--accent); font-size: 42px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .report-legends { display: grid; gap: 8px; margin-top: 22px; color: #a7b4c7; font-size: 16px; line-height: 1.4; }
    .report-conclusion { border-top: 1px solid #ffffff18; padding-top: 20px; color: #eef4f8; font-size: 23px; line-height: 1.45; }
    .scam-backdrop { position: fixed; z-index: 50; inset: 0; padding: 24px; display: grid; place-items: center; background: #03060bd9; backdrop-filter: blur(6px); }
    .scam-dialog { --accent: #ff2d95; --accent-light: #ff8cc6; --accent-dark: #55223f; width: min(1600px, 100%); height: min(900px, calc(100dvh - 48px)); min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 20px; padding: 24px; border: 1px solid var(--accent); border-top: 4px solid var(--accent); border-radius: 22px; background: #101722; box-shadow: 0 24px 120px #000c; }

    .scam-dialog-heading { display: flex; justify-content: space-between; align-items: center; gap: 24px; }
