[package]
name = "pix-race"
version = "0.1.0"
edition = "2021"
description = "Demo: IA detecta golpe do Pix e rastreia a quadrilha. Rust + Jev vs Python + DeepSeek."

[lib]
name = "pix_race"
path = "src/lib.rs"

[[bin]]
name = "gerar-dados"
path = "src/bin/gerar_dados.rs"

[[bin]]
name = "trace"
path = "src/bin/trace.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
anyhow = "1"
rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
memory-stats = "1"

[profile.release]
opt-level = 3
